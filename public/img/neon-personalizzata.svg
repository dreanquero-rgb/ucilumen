<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' role='img' aria-label='Lampada neon personalizzata'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#2A2016'/><stop offset='100%' stop-color='#14100B'/></linearGradient>
    <filter id='glow'><feGaussianBlur stdDeviation='3.5' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
  </defs>
  <rect width='400' height='300' fill='url(#bg)'/>
  <text x='200' y='152' text-anchor='middle' font-family='Georgia, serif' font-size='58' fill='#F6B24A' filter='url(#glow)'>Nome</text>
  <text x='200' y='214' text-anchor='middle' font-family='sans-serif' font-size='14' letter-spacing='2' fill='#C9A06A'>NEON PERSONALIZZATO</text>
</svg>
