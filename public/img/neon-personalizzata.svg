<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300' role='img' aria-label='Lampada neon personalizzata'>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='#241a3f'/><stop offset='100%' stop-color='#140f26'/></linearGradient>
    <filter id='glow'><feGaussianBlur stdDeviation='3.5' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter>
  </defs>
  <rect width='400' height='300' fill='url(#bg)'/>
  <text x='200' y='150' text-anchor='middle' font-family='Georgia, serif' font-size='58' fill='#ffd9ec' filter='url(#glow)'>Nome</text>
  <text x='200' y='212' text-anchor='middle' font-family='sans-serif' font-size='15' letter-spacing='2' fill='#b9a7ff'>NEON PERSONALIZZATO</text>
</svg>
